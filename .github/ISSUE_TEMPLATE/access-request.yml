name: 申请主仓库协作权限
description: 项目组成员申请访问并参与私有主仓库
title: "[Access] "
assignees:
  - Wuyuya-yyy
body:
  - type: markdown
    attributes:
      value: |
        此 Issue 是公开的。请勿填写学号、手机号、邮箱、密码、令牌或其他敏感信息。提交后，仓库所有者会在线下核验项目组身份。
  - type: input
    id: github_username
    attributes:
      label: GitHub 用户名
      description: 填写你准备接受协作者邀请的 GitHub 用户名。
      placeholder: your-github-username
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: 项目角色
      options:
        - 前端开发
        - 后端开发
        - 测试与文档
        - 数据分析
        - 项目管理与集成
        - 其他项目组成员
    validations:
      required: true
  - type: textarea
    id: responsibility
    attributes:
      label: 计划承担的任务
      description: 简要说明你将负责的模块，避免填写个人敏感信息。
      placeholder: 例如：负责收支明细页面与接口联调
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 申请确认
      options:
        - label: 我确认自己是该课程项目组成员，并同意由仓库所有者线下核验身份。
          required: true
        - label: 我承诺不提交密码、令牌、真实家庭财务数据或其他敏感信息。
          required: true
